name: Build Windows app
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: AtomicNorth-Windows
          path: dist/*.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          body: |
            **Atomic North** for Windows: Grade 11 Chemistry, Chapter 1.

            - `AtomicNorth-Setup-*.exe`: installer (recommended)
            - `AtomicNorth-Portable-*.exe`: runs without installing

            Windows may show "Windows protected your PC" because the app isn't code-signed yet. Click **More info**, then **Run anyway**.

            Prefer not to download? Use the web version: https://raminabiri.github.io/atomic-north-chem11/
